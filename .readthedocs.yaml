version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # Installs the real package (so mkdocstrings can resolve its actual dependencies/type
    # hints) plus the `docs` extra (mkdocs/mkdocs-material/mkdocstrings themselves) -- see
    # pyproject.toml's [project.optional-dependencies].
    - method: pip
      path: python_modules/dagster-cube-dbt
      extra_requirements:
        - docs
