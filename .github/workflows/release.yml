name: Release

# `main` produces real releases (0.2.0, 0.2.1, ...); `next` produces preview/pre-release builds
# (0.2.0rc1, 0.2.0rc2, ...) -- see the `[tool.semantic_release.branches]` config in
# pyproject.toml. Either way, nothing gets tagged or published unless `test` passes first.
on:
  push:
    branches: [main, next]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Version, changelog & tag
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # The default GITHUB_TOKEN authenticates as github-actions[bot], which the main/next
      # ruleset (requiring changes via PR) has no reason to exempt -- it can't tell an
      # automated release push from an accidental direct one. A short-lived installation
      # token from a dedicated release GitHub App (scoped to just `contents: write` on this
      # repo, added to the ruleset's bypass list) authenticates as that app's own bot
      # identity instead, distinct from a human's account and never a long-lived secret --
      # it's minted fresh here and expires in about an hour.
      - name: Generate a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # `client-id` (the App's Client ID, not its numeric App ID) is what this action
          # wants -- `app-id` still works but is deprecated.
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          # python-semantic-release needs the full commit history (not just the latest commit)
          # to find the last release tag and walk commits since it.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Force release branch to be at workflow sha
        run: git reset --hard ${{ github.sha }}

      - uses: astral-sh/setup-uv@v10.0.1

      # The python-semantic-release/python-semantic-release Docker action rebuilds its image
      # fresh from an unpinned GitPython on every run, which currently breaks on GitPython
      # 3.1.60 removing Actor.name_email_regex (upstream python-semantic-release#1475/#1476,
      # fix python-semantic-release#1477 -- all still open as of 2026-08). Rather than wait,
      # this runs the exact same `semantic-release version` CLI the action itself shells out to
      # (confirmed against its src/gh_action/action.sh) as a plain step instead, with GitPython
      # pinned to the last working release -- the same workaround
      # OpenJobDescription/openjd-model-for-python#339 used for this bug, adapted from their
      # pip-based release step to our uv-based one. GITHUB_OUTPUT is written by the CLI itself
      # (semantic_release/cli/github_actions_output.py), not the action wrapper, so
      # steps.release.outputs.* below are unaffected by dropping the Docker action.
      - name: Version, changelog, tag & GitHub Release
        id: release
        working-directory: python_modules/dagster-cube-dbt
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_COMMIT_AUTHOR: "${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>"
        run: |
          git config --global user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config --global user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          uvx --from python-semantic-release==10.6.1 --with GitPython==3.1.59 semantic-release -v version

  publish:
    name: Build & publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    # Registered on PyPI's side as the Trusted Publisher's expected environment name -- see the
    # one-time setup notes in python_modules/dagster-cube-dbt/README.md.
    environment:
      name: pypi
      url: https://pypi.org/project/dagster-cube-dbt/${{ needs.release.outputs.version }}/
    permissions:
      # The only credential this job needs: a short-lived OIDC token PyPI exchanges for upload
      # rights, scoped to this exact repo/workflow/environment. No PyPI API token is stored as
      # a secret anywhere.
      id-token: write
    defaults:
      run:
        working-directory: python_modules/dagster-cube-dbt
    steps:
      - uses: actions/checkout@v7
        with:
          # The `release` job just committed and tagged this -- build exactly what got tagged,
          # not whatever `github.sha` was before that commit landed.
          ref: ${{ needs.release.outputs.tag }}

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python_modules/dagster-cube-dbt/dist
