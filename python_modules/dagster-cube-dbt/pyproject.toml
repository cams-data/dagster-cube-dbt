[project]
name = "dagster-cube-dbt"
version = "0.3.0-rc.2"
description = "A Dagster Component that generates a Cube semantic-layer schema from a dbt project and exposes it as Dagster assets."
readme = "README.md"
authors = [
    { name = "cams-games", email = "cam.d.clarke@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "dagster~=1.13.0",
    "dagster-dbt",
    "pyyaml",
    "deepmerge",
    "requests",
]

[project.optional-dependencies]
# Doc-site build tooling only -- nobody installs this to use the library. Kept as an extra
# (`pip install .[docs]`) rather than a dependency-group so Read the Docs' `extra_requirements`
# config option can reference it directly.
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[project.urls]
Homepage = "https://github.com/cams-data/dagster-cube-dbt"
Repository = "https://github.com/cams-data/dagster-cube-dbt"
Issues = "https://github.com/cams-data/dagster-cube-dbt/issues"
Changelog = "https://github.com/cams-data/dagster-cube-dbt/blob/main/python_modules/dagster-cube-dbt/CHANGELOG.md"

[project.entry-points."dagster_dg_cli.registry_modules"]
dagster_cube_dbt = "dagster_cube_dbt"

[dependency-groups]
dev = [
    "pytest",
    "dbt-duckdb",
]

[tool.hatch.envs.test]
# Runs the test suite against dbt-core (the default `uv run pytest` path) and, separately,
# against the dbt Fusion engine -- they can't be installed in the same environment (Fusion
# is published as a pre-release of a distribution literally named `dbt`, colliding with
# dbt-core's own console script), so each matrix leg gets its own Hatch-managed venv. See
# DECISIONS.md for what prompted this and what it caught. `python` is a matrix axis below,
# not fixed here -- `requires-python`/classifiers claim 3.12 and 3.13 support, so both are
# actually exercised in CI rather than just claimed.
dependencies = [
    "pytest",
    "dagster~=1.13.0",
    "dagster-dbt",
    "pyyaml",
    "deepmerge",
    "requests",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.12", "3.13"]
dbt-engine = ["core", "fusion"]

[tool.hatch.envs.test.overrides]
matrix.dbt-engine.dependencies = [
    { value = "dbt-duckdb", if = ["core"] },
    # NOT a bare "dbt" -- that resolves to the unrelated, stable "dbt Cloud CLI" package
    # (also published under the bare name "dbt"), since installers don't consider
    # prereleases by default. A version specifier whose *lower bound* is itself a
    # prerelease implicitly allows prereleases to satisfy it (PEP 440), which both excludes
    # dbt Cloud CLI (currently 0.x) and keeps picking up newer Fusion prereleases without
    # needing a manual version bump or an explicit --pre/prerelease-allow flag.
    { value = "dbt>=2.0.0rc0", if = ["fusion"] },
]
matrix.dbt-engine.env-vars = [
    { key = "DAGSTER_CUBE_DBT_TEST_DBT_TARGET", value = "dev", if = ["core"] },
    { key = "DAGSTER_CUBE_DBT_TEST_DBT_TARGET", value = "fusion", if = ["fusion"] },
]

[tool.hatch.envs.test.scripts]
run = "pytest tests/ {args}"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.semantic_release]
# The single source of truth for the version is this field -- python-semantic-release computes
# the next version from Conventional Commits since the last release and writes it straight
# back in here (and to the git tag/changelog), rather than deriving it separately at build time.
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
# The version-bump commit this step pushes to main/next is itself a push to that branch,
# which would otherwise retrigger release.yml -- harmless (python-semantic-release recognizes
# and excludes its own commits when it runs again, so nothing loops), but it wastes a full CI
# matrix run every release for no reason. GitHub Actions natively skips push-triggered runs
# for a commit whose message contains `[skip ci]`, so appending it here (default is just
# "{version}\n\nAutomatically generated by python-semantic-release", confirmed against psr's
# own source -- semantic_release/const.py's COMMIT_MESSAGE) avoids the extra run without any
# workflow-level conditional needed. Careful writing *this* commit's own message, though --
# GitHub scans the whole message for that marker, not just a trailing tag, so even describing
# it in prose in an unrelated commit is enough to skip that commit's own required PR checks
# (happened once already, caught because pr.yml's checks silently never ran at all).
commit_message = "{version}\n\nAutomatically generated by python-semantic-release [skip ci]"
# The CI workflow builds and publishes separately (see .github/workflows/release.yml) -- this
# step's job is only to compute the version, changelog, commit, tag, and GitHub Release.
build_command = ""
# Default is `true` (a breaking change on a 0.x version jumps straight to 1.0.0). While this
# library is still 0.x, breaking changes are common enough during normal iteration (e.g. a
# resource field getting renamed) that treating every one of them as "declare 1.0 now" would be
# wrong -- 1.0 should be a deliberate milestone, not an accidental side effect of a commit
# message. Flip this to `true` (or just delete the line, matching the default) whenever that
# milestone is actually decided.
major_on_zero = false
# A *different* setting from `major_on_zero` above: this one governs whether the very first
# release is allowed to land below 1.0.0 at all. Default is `false`, which would make the
# first ever release 1.0.0 regardless of `major_on_zero` -- confirmed by actually dry-running
# `semantic-release version --print` locally before ever pushing, not assumed. Explicitly
# `true` so the first release is 0.1.0, matching the version already declared above.
allow_zero_version = true

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

# Preview/pre-release packages: commits pushed to `next` are published to the real PyPI index
# as prereleases (e.g. 0.2.0rc1) -- `pip install dagster-cube-dbt` never picks these up by
# default (PEP 440 excludes prereleases from plain resolution), only `pip install --pre` or an
# exact version pin does. Merge `next` back into `main` when it's ready to become the real
# release.
[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"
