version: 2

models:
  - name: journey_samples
    description: Individual journey samples.
    config:
      contract:
        enforced: true
    columns:
      - name: journey_sample_key
        data_type: integer
        tests:
          - unique
          - not_null
      - name: journey_type
        data_type: varchar
        description: The type of journey.
      - name: direction
        data_type: varchar
      - name: destination_location_key
        data_type: integer
      - name: origin_location_key
        data_type: integer
      - name: date_key
        data_type: integer
      - name: internal_row_hash
        # dbt contracts require a data_type on every declared column regardless of our own
        # meta.cube.dimension: false exclusion -- dbt has no notion of that flag.
        data_type: varchar
        config:
          meta:
            cube:
              dimension: false

  - name: destination_locations
    config:
      contract:
        enforced: true
    columns:
      - name: geographic_location_key
        data_type: integer
        tests:
          - unique
          - not_null
      - name: location_name
        data_type: varchar

  - name: origin_locations
    config:
      contract:
        enforced: true
    columns:
      - name: geographic_location_key
        data_type: integer
        tests:
          - unique
          - not_null
      - name: location_name
        data_type: varchar

  - name: dates
    config:
      contract:
        enforced: true
    columns:
      - name: date_key
        data_type: integer
        tests:
          - unique
          - not_null
      - name: calendar_date
        data_type: date
