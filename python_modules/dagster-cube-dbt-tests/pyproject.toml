[project]
name = "dagster_cube_dbt_tests"
requires-python = ">=3.12,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.18",
    "dagster-dbt",
    "dagster-cube-dbt",
    "dbt-duckdb",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[tool.uv.sources]
dagster-cube-dbt = { path = "../dagster-cube-dbt", editable = true }



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_cube_dbt_tests"
registry_modules = [
    "dagster_cube_dbt_tests.components.*",
]


